<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locus architecture: browser, API with booking engine, solver, parser and validator, database">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f1b33; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #46556f; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #8a6a1f; }
    .box { fill: #ffffff; stroke: #1c2f5a; stroke-width: 1.6; }
    .gold { fill: #fff6df; stroke: #c9962e; stroke-width: 1.6; }
    .navy { fill: #14264d; stroke: #14264d; }
    .zone { fill: #f4f6fb; stroke: #c3cbdd; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ln { stroke: #1c2f5a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .dash { stroke: #8a6a1f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c2f5a"/></marker></defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="24" y="34" class="t" style="font-size:20px">Locus architecture</text>
  <text x="24" y="54" class="s">Validity is decided by code. The optional LLM only suggests values for a draft that the user can edit.</text>

  <!-- browser -->
  <rect x="24" y="80" width="250" height="400" rx="14" class="zone"/>
  <text x="40" y="104" class="h">BROWSER · VERCEL</text>
  <rect x="42" y="120" width="214" height="150" rx="10" class="box"/>
  <text x="56" y="144" class="t">Next.js 15 web app</text>
  <text x="56" y="164" class="s">Overview · Timetable · Exams</text>
  <text x="56" y="181" class="s">Venues · Assistant · Approvals</text>
  <text x="56" y="198" class="s">Changes · Exports · Users</text>
  <text x="56" y="215" class="s">Organisations · Intro</text>
  <text x="56" y="238" class="s">4 roles: Admin, Coordinator,</text>
  <text x="56" y="254" class="s">Faculty, Club representative</text>
  <rect x="42" y="290" width="214" height="86" rx="10" class="box"/>
  <text x="56" y="314" class="t">AppProvider</text>
  <text x="56" y="334" class="s">reference data + 15 s poll;</text>
  <text x="56" y="351" class="s">screens reload when the</text>
  <text x="56" y="368" class="s">workspace revision changes</text>
  <rect x="42" y="392" width="214" height="70" rx="10" class="gold"/>
  <text x="56" y="416" class="t">Session</text>
  <text x="56" y="436" class="s">JWT in sessionStorage;</text>
  <text x="56" y="452" class="s">light / dark theme choice</text>

  <!-- api -->
  <rect x="330" y="80" width="400" height="400" rx="14" class="zone"/>
  <text x="346" y="104" class="h">API · FASTAPI ON RENDER</text>
  <rect x="348" y="120" width="364" height="64" rx="10" class="box"/>
  <text x="362" y="144" class="t">Auth and permissions</text>
  <text x="362" y="164" class="s">JWT · bcrypt · role read from the database on every request</text>
  <rect x="348" y="198" width="364" height="64" rx="10" class="box"/>
  <text x="362" y="222" class="t">Routes (api*.py)</text>
  <text x="362" y="242" class="s">campus · bookings · negotiation · repair · admin · explain · faculty</text>
  <rect x="348" y="278" width="176" height="92" rx="10" class="gold"/>
  <text x="362" y="302" class="t">Booking engine</text>
  <text x="362" y="322" class="s">priority · role caps ·</text>
  <text x="362" y="338" class="s">displacement · re-decide</text>
  <text x="362" y="354" class="s">unconfirmed requests</text>
  <rect x="536" y="278" width="176" height="92" rx="10" class="gold"/>
  <text x="550" y="302" class="t">OR-Tools CP-SAT</text>
  <text x="550" y="322" class="s">timetable · exams ·</text>
  <text x="550" y="338" class="s">fewest-moves repair</text>
  <text x="550" y="354" class="s">(with proof of minimum)</text>
  <rect x="348" y="386" width="176" height="76" rx="10" class="box"/>
  <text x="362" y="410" class="t">Request parser</text>
  <text x="362" y="430" class="s">English + Hinglish rules;</text>
  <text x="362" y="446" class="s">optional LLM assist (off)</text>
  <rect x="536" y="386" width="176" height="76" rx="10" class="navy"/>
  <text x="550" y="410" class="t" style="fill:#fff">Official validator</text>
  <text x="550" y="430" class="s" style="fill:#d7def0">unmodified validator.py;</text>
  <text x="550" y="446" class="s" style="fill:#d7def0">final gate on every export</text>

  <!-- data -->
  <rect x="780" y="80" width="156" height="400" rx="14" class="zone"/>
  <text x="794" y="104" class="h">DATA</text>
  <rect x="796" y="120" width="124" height="160" rx="10" class="box"/>
  <text x="808" y="144" class="t">PostgreSQL</text>
  <text x="808" y="162" class="s">Supabase;</text>
  <text x="808" y="178" class="s">SQLite when</text>
  <text x="808" y="194" class="s">DATABASE_URL</text>
  <text x="808" y="210" class="s">is unset</text>
  <text x="808" y="236" class="s">users · organisations</text>
  <text x="808" y="252" class="s">workspace · audit</text>
  <rect x="796" y="300" width="124" height="90" rx="10" class="gold"/>
  <text x="808" y="324" class="t">Exports</text>
  <text x="808" y="342" class="s">schedule.json</text>
  <text x="808" y="358" class="s">schedule_after.json</text>
  <text x="808" y="374" class="s">in exports/</text>
  <rect x="796" y="406" width="124" height="56" rx="10" class="box"/>
  <text x="808" y="430" class="t">Dataset</text>
  <text x="808" y="448" class="s">cit_public.json</text>

  <!-- arrows -->
  <path class="ln" d="M256 195 H348"/>
  <text x="270" y="186" class="s">HTTPS + JWT</text>
  <path class="ln" d="M530 184 V198" style="marker-end:none"/>
  <path class="ln" d="M436 262 V278"/>
  <path class="ln" d="M624 262 V278"/>
  <path class="ln" d="M624 370 V386"/>
  <path class="ln" d="M712 230 H796"/>
  <path class="ln" d="M712 420 L796 350" />
  <path class="ln" d="M796 430 H712" style="marker-end:url(#a)"/>
  <text x="352" y="505" class="s">Render builds the API from branch feature/backend (Docker); Vercel builds the web app from main.</text>
  <text x="352" y="523" class="s">Settings: .env.example · AI use: AI_USAGE.md · Third-party: THIRD_PARTY.md</text>
</svg>
